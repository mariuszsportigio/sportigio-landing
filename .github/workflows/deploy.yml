name: Build and Deploy (release/v1-static)

on:
  push:
    branches:
      - release/v1-static

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy_rsync:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/release/v1-static'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Prepare SSH (known_hosts + config)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Add host key to known_hosts so StrictHostKeyChecking can pass
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Pin SSH behavior so both ssh and rsync use the same settings
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName ${{ vars.DEPLOY_HOST }}
            User ${{ vars.DEPLOY_USER }}
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          CFG
          chmod 600 ~/.ssh/config

      - name: Debug keys in agent
        run: |
          echo "Loaded keys in agent:"
          ssh-add -l || true

      - name: Test SSH
        run: |
          ssh -o BatchMode=yes deploy-target "whoami && echo ok"

      - name: Deploy via rsync
        run: |
          rsync -az --delete dist/ deploy-target:${{ vars.DEPLOY_PATH }}
